<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cinema | 沉浸式体验</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-background"></div>

    <header class="glass-header">
        <div class="header-content">
            <div class="logo">Cinema</div>
            <nav>
                <a href="#" class="active">精选</a>
                <a href="#">库</a>
                <a href="#">搜索</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1 class="fade-in-up">视觉盛宴</h1>
            <p class="fade-in-up delay-1">R2 + Cloudflare Pages 极致传输</p>
        </section>

        <section class="video-gallery">
            <h2 class="section-title">最近更新</h2>
            <div class="video-grid" id="video-grid">
                </div>
        </section>
    </main>

    <div id="video-modal" class="modal">
        <div class="modal-blur-bg"></div>
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modal-title-text">播放中</span>
                <button class="close-btn">完成</button>
            </div>
            <div class="video-wrapper">
                <video id="modal-video-player" width="100%" height="100%" controls controlsList="nodownload" playsinline></video>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
